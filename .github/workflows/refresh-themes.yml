name: Refresh themes-data.json

on:
  schedule:
    # Daily at 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Fetches and decodes images from theme authors, so it holds no write access.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: nothing from another run should execute here.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      # Frozen lockfile: install exactly what bun.lock pins, never resolve
      # fresh semver ranges in CI (supply-chain hardening).
      - run: bun install --frozen-lockfile

      - name: Scrape themes from GitHub
        run: node scripts/scrape.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ALERTS_PATH: repo-alerts.json

      - name: Collect results
        run: |
          mkdir refresh
          mv repo-alerts.json refresh/
          cp src/data/themes-data.json src/data/scrape-404s.json src/data/theme-owners.json refresh/
          cp -r public/thumbs refresh/thumbs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh
          path: refresh
          retention-days: 1
          if-no-files-found: error

  # Holds the write token. Installs nothing and never decodes an image.
  publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh

      - name: Validate results
        run: node scripts/validate-refresh.js "$RUNNER_TEMP/refresh"

      - name: Commit if changed
        run: |
          cp "$RUNNER_TEMP"/refresh/themes-data.json "$RUNNER_TEMP"/refresh/scrape-404s.json "$RUNNER_TEMP"/refresh/theme-owners.json src/data/
          rm -rf public/thumbs
          cp -r "$RUNNER_TEMP/refresh/thumbs" public/thumbs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/themes-data.json src/data/scrape-404s.json src/data/theme-owners.json public/thumbs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh themes-data.json"
            # Rebase onto any commits pushed while we were scraping, then retry once.
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "Push attempt $attempt failed; refetching and retrying..."
              sleep 5
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi

      - name: File issues for lost repos
        if: github.ref_name == 'main'
        run: node scripts/file-repo-issues.js "$RUNNER_TEMP/refresh/repo-alerts.json"
