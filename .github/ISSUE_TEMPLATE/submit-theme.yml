name: Submit a Theme
description: Add your Omarchy theme to the gallery. Paste the repo URL and you're done.
labels: ["theme-submission"]
body:
  - type: input
    id: repo_url
    attributes:
      label: GitHub Repository URL
      placeholder: https://github.com/username/my-omarchy-theme
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Anything else? (optional)
      placeholder: A one-line description, or notes for the maintainer.
    validations:
      required: false
